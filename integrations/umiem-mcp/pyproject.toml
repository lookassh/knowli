[project]
name = "umiem-consumer"
version = "0.2.0"
description = "Read-only Umiem learning overview contract validator and Hermes skill"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "tzdata==2026.5",
]

[dependency-groups]
hermes-test = ["PyYAML==6.0.3", "httpx==0.28.1", "mcp==1.30.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umiem_mcp"]

[tool.unittest]
test-dir = "tests"
