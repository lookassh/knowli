[project]
name = "umiem-mcp"
version = "0.1.0"
description = "Read-only Umiem learning overview MCP server"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.1,<1",
  "jsonschema>=4.20,<5",
  "mcp>=1.28,<2",
  "tzdata>=2024.1,<2027",
]

[project.scripts]
umiem-mcp = "umiem_mcp.__main__:main"

[dependency-groups]
hermes-test = ["PyYAML==6.0.3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umiem_mcp"]

[tool.unittest]
test-dir = "tests"
