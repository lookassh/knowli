# CodeQL — skan bezpieczeństwa kodu (darmowy dla publicznego repo).
# Niezależny od CI testowego: analizuje TypeScript (workspace pnpm) i Python
# (pakiet konsumenta MCP). Uruchamia się na PR i main, plus cotygodniowy skan
# planowany. Wyniki lądują w zakładce Security → Code scanning alerts.

name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "35 4 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ["typescript", "python"]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Install dependencies (TypeScript)
        if: matrix.language == 'typescript'
        run: |
          pnpm install --frozen-lockfile
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
