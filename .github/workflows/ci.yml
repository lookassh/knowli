# CI — pełny cykl testów przed scaleniem do main.
# Uruchamiany na każdy Pull Request oraz na push do main: produkcja deployuje
# się automatycznie z main, więc scalony kod musi przejść ten sam cykl.
# Testy są samowystarczalne: integration i e2e stawiają własne kontenery
# postgres:17-alpine w global-setup, e2e działa na fake providerach (bez kluczy).
# E2e biegnie w 5 równoległych jobach (osobne runnery, każdy z własnym światem):
# projekt mocked osobno, a real w koszach czasowych REAL_BUCKETS (spec-projects.ts).
# Integracja biegnie w koszach czasowych INTEGRATION_BUCKETS
# (tests/integration-buckets.ts) jako równoległe joby z własnym kontenerem,
# a `tests` jest bramką pod nazwą wymaganego checka: agreguje job `check`
# (typecheck, unit, build) oraz kosze integracji.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Przestarzałe runy na zaktualizowanym PR anulujemy; runów dla main nie przerywamy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Telemetria Next.js off wszędzie, także dla buildu i `next start` stawianego przez e2e.
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: check (typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.ts', 'apps/web/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-build-${{ runner.os }}-node22-
      - name: Build web
        env:
          # Build nie łączy się z bazą (leniwa inicjalizacja), ale walidacja
          # środowiska wymaga obecnej wartości.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/knowli
        run: pnpm build

  integration:
    name: integration (${{ matrix.bucket }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Pierwszy failure nie zabiera pozostałych koszy — pełny obraz runu.
      fail-fast: false
      # Każdy job stawia własny kontener Postgresa (global-setup per proces),
      # bo pliki integracyjne biegną sekwencyjnie na wspólnej bazie przebiegu
      # i czyszczą tabele w beforeEach. Kosze INTEGRATION_BUCKETS równoważą
      # czasy plików; zmiana liczby koszy: zaktualizuj INTEGRATION_BUCKETS
      # i ten matrix — zgodności pilnuje test jednostkowy integration-buckets.
      matrix:
        include:
          - bucket: "1"
          - bucket: "2"
          - bucket: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integration tests
        env:
          UMIEM_INTEGRATION_BUCKET: ${{ matrix.bucket }}
        run: pnpm test:integration

  tests:
    name: tests
    # Bramka pod nazwą wymaganego checka `tests`: sama niczego nie testuje,
    # tylko agreguje wyniki jobów check i integration, żeby podział na
    # równoległe joby nie wymagał zmian w regułach ochrony brancha.
    needs: [check, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify check and integration jobs
        run: |
          echo "check=${{ needs.check.result }} integration=${{ needs.integration.result }}"
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ]; then
            exit 1
          fi

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Pierwszy failure nie zabiera pozostałych shardów — pełny obraz runu.
      fail-fast: false
      # Każdy job to osobny świat (własny postgres, `next start`, worker), bo
      # global-setup działa per proces. Kosze REAL_BUCKETS równoważą czasy plików
      # realnych (podział Playwrighta po liczbie testów zostawiał 98/58/105 s).
      # Zmiana liczby koszy: zaktualizuj REAL_BUCKETS, ten matrix i DEFAULT_REAL_BUCKETS
      # w runnerze shardów; kompletności pilnuje test jednostkowy spec-projects.
      matrix:
        include:
          - name: mocked
            project: mocked
            bucket: ""
          - name: real-1
            project: real
            bucket: "1"
          - name: real-2
            project: real
            bucket: "2"
          - name: real-3
            project: real
            bucket: "3"
          - name: real-4
            project: real
            bucket: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js E2E cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-e2e-${{ runner.os }}-node22-${{ matrix.name }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.ts', 'apps/web/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-node22-${{ matrix.name }}-
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        env:
          UMIEM_E2E_BUCKET: ${{ matrix.bucket }}
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Upload test artifacts unless green
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
