# CI — pełny cykl testów przed scaleniem do main.
# Uruchamiany na każdy Pull Request oraz na push do main: produkcja deployuje
# się automatycznie z main, więc scalony kod musi przejść ten sam cykl.
# Testy są samowystarczalne: integration i e2e stawiają własne kontenery
# postgres:17-alpine w global-setup, e2e działa na fake providerach (bez kluczy).
# E2e biegnie w 7 równoległych jobach (osobne runnery, każdy z własnym światem):
# projekt mocked w 3 shardach Playwrighta, a real w koszach czasowych REAL_BUCKETS
# (spec-projects.ts); `e2e (mocked)` to bramka pod nazwą wymaganego checka.
# Integracja biegnie w koszach czasowych INTEGRATION_BUCKETS
# (tests/integration-buckets.ts) jako równoległe joby z własnym kontenerem,
# a `tests` jest bramką pod nazwą wymaganego checka: agreguje job `check`
# (typecheck, unit, build) oraz kosze integracji.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Przestarzałe runy na zaktualizowanym PR anulujemy; runów dla main nie przerywamy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Telemetria Next.js off wszędzie, także dla buildu i `next start` stawianego przez e2e.
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: check (typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.ts', 'apps/web/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-build-${{ runner.os }}-node22-
      - name: Build web
        env:
          # Build nie łączy się z bazą (leniwa inicjalizacja), ale walidacja
          # środowiska wymaga obecnej wartości.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/knowli
        run: pnpm build

  integration:
    name: integration (${{ matrix.bucket }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Pierwszy failure nie zabiera pozostałych koszy — pełny obraz runu.
      fail-fast: false
      # Każdy job stawia własny kontener Postgresa (global-setup per proces),
      # bo pliki integracyjne biegną sekwencyjnie na wspólnej bazie przebiegu
      # i czyszczą tabele w beforeEach. Kosze INTEGRATION_BUCKETS równoważą
      # czasy plików; zmiana liczby koszy: zaktualizuj INTEGRATION_BUCKETS
      # i ten matrix — zgodności pilnuje test jednostkowy integration-buckets.
      matrix:
        include:
          - bucket: "1"
          - bucket: "2"
          - bucket: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integration tests
        env:
          UMIEM_INTEGRATION_BUCKET: ${{ matrix.bucket }}
        run: pnpm test:integration

  tests:
    name: tests
    # Bramka pod nazwą wymaganego checka `tests`: sama niczego nie testuje,
    # tylko agreguje wyniki jobów check i integration, żeby podział na
    # równoległe joby nie wymagał zmian w regułach ochrony brancha.
    needs: [check, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify check and integration jobs
        run: |
          echo "check=${{ needs.check.result }} integration=${{ needs.integration.result }}"
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ]; then
            exit 1
          fi

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Pierwszy failure nie zabiera pozostałych shardów — pełny obraz runu.
      fail-fast: false
      # Każdy job to osobny świat (własny postgres, `next start`, worker), bo
      # global-setup działa per proces. Kosze REAL_BUCKETS równoważą czasy plików
      # realnych (podział Playwrighta po liczbie testów zostawiał 98/58/105 s).
      # Zmiana liczby koszy: zaktualizuj REAL_BUCKETS, ten matrix i DEFAULT_REAL_BUCKETS
      # w runnerze shardów; kompletności pilnuje test jednostkowy spec-projects.
      # Kosze real są osobnymi wymaganymi checkami `e2e (real-N)` w regułach brancha
      # main: nowy kosz trzeba tam dopisać, a usunięty usunąć, inaczej PR-y utkną.
      # Projekt mocked (bezstanowy) dzielą shardy Playwrighta: jako jeden job na
      # 4 workerach trwał 5,5 min (4,8 min testów) i wyznaczał czas całego runu
      # (joby real 2,6–3,2 min). Liczbę shardów zmienia sam matrix — wymagany check
      # raportuje bramka `e2e-mocked`. Shardy dzielą jeden cache Next.js (`cache`).
      matrix:
        include:
          - name: mocked-1
            project: mocked
            bucket: ""
            shard: "1/3"
            cache: mocked
          - name: mocked-2
            project: mocked
            bucket: ""
            shard: "2/3"
            cache: mocked
          - name: mocked-3
            project: mocked
            bucket: ""
            shard: "3/3"
            cache: mocked
          - name: real-1
            project: real
            bucket: "1"
          - name: real-2
            project: real
            bucket: "2"
          - name: real-3
            project: real
            bucket: "3"
          - name: real-4
            project: real
            bucket: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js E2E cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-e2e-${{ runner.os }}-node22-${{ matrix.cache || matrix.name }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.ts', 'apps/web/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-node22-${{ matrix.cache || matrix.name }}-
      # Przeglądarka jest cache'owana między runami (klucz = lockfile, więc zmiana wersji Playwrighta unieważnia cache). Bez tego każdy job e2e pobierał Chromium od zera, a `--with-deps` dokładał `apt-get update` i instalację pakietów z lustra Ubuntu — krok trwał 20 s do ~5 min zależnie od lustra i wyznaczał czas całego runu.
      - name: Cache Playwright chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      # Pełny install z zależnościami systemowymi tylko przy braku cache.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # Przy trafionym cache apt jest pomijany: obraz runnera ma biblioteki systemowe Chromium (apt dokładał głównie fonty CJK, których testy pl/en nie używają; brak też asercji screenshotów). Gdyby instalacji z cache albo probe launch coś się nie powiodło, zależności zostaną dociągnięte jak przy pustym cache.
      - name: Install Playwright chromium (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          { pnpm exec playwright install chromium && node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch(); await browser.close();"; } || pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        env:
          UMIEM_E2E_BUCKET: ${{ matrix.bucket }}
          E2E_PROJECT: ${{ matrix.project }}
          E2E_SHARD: ${{ matrix.shard }}
        run: pnpm exec playwright test --project="$E2E_PROJECT" ${E2E_SHARD:+--shard="$E2E_SHARD"}
      - name: Upload test artifacts unless green
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.name }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-mocked:
    # Bramka pod nazwą wymaganego checka `e2e (mocked)` (reguły brancha main):
    # sama niczego nie testuje, a podział projektu mocked na shardy nie wymaga
    # zmian w regułach. Wymaga łącznego sukcesu matrixa e2e (shardy mocked
    # i kosze real — każdy kosz real i tak jest osobnym wymaganym checkiem)
    # i dodatkowo sprawdza ostatnią próbę każdego sharda `e2e (mocked-N)` przez
    # API: po ponowieniu tylko części jobów łączny wynik matrixa nie może przepuścić
    # sharda, który nadal ma porażkę.
    name: e2e (mocked)
    needs: [e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Verify e2e jobs
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e=$NEEDS_RESULT"
          if [ "$NEEDS_RESULT" != "success" ]; then
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name | startswith("e2e (mocked-")) | "\(.name)=\(.conclusion)"' > shards.txt
          cat shards.txt
          if [ ! -s shards.txt ] || grep -v '=success$' shards.txt; then
            exit 1
          fi
