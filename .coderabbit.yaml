language: "pl-PL"

reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "packages/kid-ui/src/**"
      instructions: |
        Prioritize asynchronous race conditions, cancellation, stale callbacks,
        recording and media lifecycle, privacy, and regression risks. Verify
        each finding against the actual code and relevant contracts. Propose
        regression tests for confirmed bugs; do not report speculative risks
        as defects.

    - path: "packages/server/src/**"
      instructions: |
        Focus on transaction correctness, authorization, data isolation between
        children, idempotency, concurrency, immutable published content, and
        recording exposure before sending revealed content. Check failure and
        retry paths as well as the happy path.

    - path: "packages/contracts/src/**"
      instructions: |
        Check backward compatibility and the impact on the public API, MCP
        adapter and schema, and consumer skills. Verify that DTOs do not expose
        answer keys, child identifiers, secrets, or internal scoring details.

    - path: "apps/worker/src/**"
      instructions: |
        Focus on job idempotency, retries, leases, transaction boundaries, and
        stale workers. For media jobs, verify immutable asset bytes and that a
        late worker cannot overwrite ready media or stale draft bindings.

    - path: "apps/web/src/integrations/**"
      instructions: |
        Check the MCP Streamable HTTP adapter against packages/contracts as
        the source of truth. Verify authentication, scopes, error behavior,
        privacy, and parity with the consumer skill; flag hand-maintained
        schema drift and claims unsupported by the implementation.
