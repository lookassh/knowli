- id: "1"
  title: Trwały plan sesji i trening słówek
  description: >-
    Zrealizuj CAP-1–CAP-5 oraz strukturalną część CAP-6 ze SPEC.md dla treningów
    standardowych i obrazkowych, wraz z trwałością planu, migracją, wydawaniem
    slotów, dostosowaniem następnej sesji i obsługą istniejących sesji.
    Przed zmianami zbierz baseline zgodnie z delivery.md.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Przeczytaj SPEC.md oraz wszystkie companions, w szczególności execution.md.
    Start dopiero po osobnym poleceniu właściciela; obecna faza to przygotowanie.
    Po starcie wykonaj RED–GREEN–Refactor, pełne testy unit/integration/e2e,
    typecheck/build, następnie jedno niezależne read-only code review naraz,
    wyłącznie gpt-6.1-sol z reasoning medium i świeżym kontekstem.
    Trafne uwagi poprawiaj, powtarzaj testy i review całego zadania do ich
    zamknięcia. Dopiero wtedy lokalny commit zadania; wcześniej żadnych
    commitów roboczych. Bez push/PR/merge/deploy. Potem kontynuuj zadanie 2.
- id: "2"
  title: Stałe plany treningu lekcji
  description: >-
    Zrealizuj CAP-1–CAP-5 ze SPEC.md dla lekcji na protokole przygotowanym
    w zadaniu 1, z zachowaniem SubjectModule i pomocy między sesjami.
    Zachowaj natychmiastowy feedback, ocenianie deterministyczne/cache/model
    oraz istniejące zasady raportów, prywatności i rozliczania.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Przeczytaj SPEC.md oraz wszystkie companions, w szczególności execution.md;
    rozpocznij po domknięciu i commicie zadania 1 oraz poleceniu startu całości.
    RED–GREEN–Refactor, pełne testy unit/integration/e2e i typecheck/build
    przed pojedynczym niezależnym read-only code review całego zadania:
    wyłącznie gpt-6.1-sol, reasoning medium, świeży kontekst; bez reviewerów
    równoległych. Po uwagach poprawki, testy i kolejne review do ich zamknięcia.
    Commit lokalny dopiero po GREEN i czystym review; bez commitów roboczych
    i bez push/PR/merge/deploy. Następnie kontynuuj zadanie 3.
- id: "3"
  title: Natychmiastowa reakcja i stabilny ekran zadania
  description: >-
    Zrealizuj CAP-6 ze SPEC.md w Kid UI dla prezentacji, odpowiedzi i przejść
    w treningu słówek oraz lekcji, zgodnie z session-rules.md i delivery.md.
    Zapewnij neutralne zaznaczenie, stan oczekiwania, stabilne wymiary i poprawne
    remaining po pominięciu niewykonalnych slotów bez lokalnego oceniania.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Przeczytaj SPEC.md i wszystkie companions, szczególnie execution.md;
    rozpocznij po domknięciu i commicie zadania 2 oraz poleceniu startu całości.
    RED–GREEN–Refactor; pełne unit/integration/e2e, typecheck/build; następnie
    jeden niezależny reviewer read-only naraz: gpt-6.1-sol, reasoning medium,
    świeży kontekst, cały zakres zadania. Sprawdź też mobile, klawiaturę i zoom.
    Powtarzaj poprawki→testy→review aż uwagi zostaną zamknięte; dopiero wtedy
    lokalny commit, wcześniej bez commitów roboczych. Bez push/PR/merge/deploy.
    Następnie kontynuuj zadanie 4.
- id: "4"
  title: Odbiór przekrojowy, pomiary i dokumentacja
  description: >-
    Potwierdź CAP-1–CAP-6 ze SPEC.md w pełnych przepływach słówek i lekcji,
    migracji, wznowieniu, mikrofonie i adaptacji następnej sesji.
    Porównaj pomiary z baseline zadania 1, domknij dokumentację i ocenę
    wpływu API→MCP→skill oraz kolejność wdrożenia zgodnie z delivery.md.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Przeczytaj SPEC.md i wszystkie companions, szczególnie execution.md;
    rozpocznij po domknięciu i commicie zadania 3 oraz poleceniu startu całości.
    Nowe poprawki logiki realizuj RED–GREEN–Refactor; nie fabrykuj RED tekstu
    dokumentacji. Uruchom pełne unit/integration/e2e, typecheck/build.
    Jeden niezależny reviewer read-only naraz, wyłącznie gpt-6.1-sol z reasoning
    medium i świeżym kontekstem, ocenia zadanie i zgodność całego rozwiązania.
    Poprawki→testy→review do zamknięcia uwag. Potem commit lokalny zadania 4;
    wcześniej bez commitów roboczych. Bez push/PR/merge/deploy. Raport końcowy
    zawiera SHA wszystkich czterech commitów, testy, review i pomiary.
