- id: "1"
  title: Sonda mowy w zestawie kalibracyjnym gradera
  description: >-
    Zrealizuj CAP-1: dopisz przypadki mówione do zestawu kalibracyjnego i
    rozszerz raport o precyzję oraz werdykty odrzucone przez walidację.
    Sprawdź AC-01–03; wynik pomiaru jest punktem odniesienia dla story 2.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Bez zmian w prompcie i kodzie oceny. Przebieg na prawdziwym modelu tylko
    po zgodzie właściciela (pnpm eval:school-grader nie ma limitu kosztu;
    jedno wywołanie na przypadek). Przypadki
    wyłącznie fikcyjne, bez danych dziecka. Raport z pomiaru pokaż
    właścicielowi przed story 2.
- id: "2"
  title: Tolerancja mowy w ocenie podyktowanej odpowiedzi
  description: >-
    Zrealizuj CAP-2 na podstawie pomiaru ze story 1: model wie, że odpowiedź
    była mówiona, toleruje cechy mowy i nie dostaje wymogu jednego zdania dla
    niepoprawionej dyktowanej odpowiedzi. Sprawdź AC-04–10.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Jeśli pomiar ze story 1 nie pokazał problemu, zgłoś to i nie zmieniaj
    promptu. Tolerancja tylko w prompcie, bez reguł językowych w kodzie.
    Podnieś wersję promptu. Przeczytaj docs/agents/lessons.md i
    docs/agents/providers-privacy.md; zaktualizuj opis danych wysyłanych do
    gradera. Powtórz pomiar tym samym modelem co w story 1.
- id: "3"
  title: Ocena wiedzy mimo wadliwych fragmentów i zachowany tekst po nieudanej ocenie
  description: >-
    Zrealizuj CAP-3 i CAP-4: wadliwy fragment werdyktu jest pomijany zamiast
    unieważniać ocenę, a po „Nie udało się ocenić” tekst zostaje w polu.
    Sprawdź AC-11–16.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Reguły wiedzy w walidacji werdyktu zostają odrzucające (AC-13). Zmiana
    zachowania cache werdyktów wymaga uzasadnienia w planie. useRetryReset
    używa wiele widoków: zmień zachowanie tylko dla ponowienia po nieocenionej
    próbie.
- id: "4"
  title: Skracanie odpowiedzi bez ślepych zaułków
  description: >-
    Zrealizuj CAP-5 i CAP-6: krok skracania tylko z widocznym zaznaczeniem, a
    po zgubieniu ważnej informacji feedback pokazuje obie wersje odpowiedzi
    dziecka. Sprawdź AC-14 i AC-17–22.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Feedback zawiera wyłącznie tekst dziecka (AC-21). Przeczytaj
    docs/agents/kid-ui.md; zmiana layoutu wymaga testu geometrii. Jeśli zmienia
    się Kid DTO, sprawdź wpływ na kontrakt API i uzasadnij brak wpływu na MCP.
- id: "5"
  title: Mikrofon i stany dyktowania odpowiedzi
  description: >-
    Zrealizuj CAP-7–10: teksty mikrofonu dla dyktowania, dopisywanie przy
    kolejnym dyktowaniu, komunikat po przerwanym nagraniu i widoczny stan
    oczekiwania na ocenę. Sprawdź AC-23–31.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Przed CAP-10 sprawdź, czy stan oczekiwania nie jest już widoczny. Dla
    CAP-8 rozstrzygnij w planie zgodność z odciskiem transkrypcji po stronie
    serwera (brownfield.md, AC-28). Teksty ćwiczenia słówek bez zmian (AC-25).
    Po story właściciel robi odbiór na tablecie.
